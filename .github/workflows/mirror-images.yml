# Copy the upstream images this repository pulls into GitHub Container
# Registry, once a month.
#
# WHY. Anonymous Docker Hub pulls are capped at 100 per six hours per IPv4
# address, and GitHub's hosted runners share addresses with every other tenant.
# This repository's own six pulls per run will never exhaust that; other
# people's do. Mirroring removes the dependency instead of shrinking it —
# GitHub Container Registry has no pull rate limit for public packages.
#
# IT PRODUCES LINUX/AMD64 IMAGES, because it copies with pull/tag/push and this
# runner is amd64 — the pushed artifacts are single-platform, not manifest
# lists. That is the mirror's defining constraint and the reason
# scripts/prime-images.ts refuses to run on any other platform. Making it
# multi-architecture would mean `docker buildx imagetools create`; not done,
# because CI is the only consumer and CI is amd64.
#
# WHAT IT DOES NOT FIX. Contributors running the suites locally still pull from
# Docker Hub — which is fine, because they are not competing for a shared
# runner address, which is the whole problem being solved. This is a CI
# measure only.
#
# ITS OWN FAILURE IS BENIGN. This job is the one place that still touches Docker
# Hub, once a month. If it is throttled, CI keeps using last month's mirror and
# nothing breaks; the refresh simply happens later.
#
# WHAT IT PINS. Four of these six are floating tags — `nginx:alpine` means
# something different from week to week. Mirroring monthly pins CI to a monthly
# snapshot, which is a reproducibility gain and also means upstream security
# fixes reach CI up to a month late. Recording the image ids makes that pin
# visible in the diff rather than silent.
name: Mirror upstream images

on:
  schedule:
    # 04:00 UTC on the first of the month.
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write        # push the refresh branch
  packages: write        # push the mirrored images
  pull-requests: write   # open the refresh pull request

concurrency:
  group: mirror-images
  cancel-in-progress: false

jobs:
  mirror:
    name: pull from source, push to ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Mirror each image and record what was mirrored
        run: bun scripts/mirror-images.ts

      # OPENS A PULL REQUEST RATHER THAN PUSHING TO master, for two reasons that
      # arrived together.
      #
      # A refreshed id means an upstream floating tag now points at different
      # content — `nginx:alpine` is not a fixed thing. That is the only moment
      # the images CI depends on change, and pushing it straight to master
      # would be the one change nothing tests. As a pull request it goes
      # through the same three jobs as any other change, so drift is caught by
      # the mechanism that already exists instead of by a scheduled run
      # invented to look for it.
      #
      # It also removes a conflict with branch protection: a bot pushing to a
      # protected master needs an exemption, and the exemption would apply to
      # the one commit nobody reviewed.
      - name: Open a pull request with the refreshed ids, if they changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet tests/support/images.json; then
            echo "No change — the mirror already matched upstream."
            exit 0
          fi
          branch="images/refresh-$(date -u +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add tests/support/images.json
          git commit -m "chore(images): refresh the upstream mirror

          Monthly refresh of the images CI pulls. A changed id means the
          upstream floating tag now points at different content; the diff is
          the point, since that is the only place this pin is visible."
          git push --force-with-lease -u origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore(images): refresh the upstream mirror" \
            --body "Monthly mirror refresh. A changed id means an upstream floating tag moved; the diff is the only place that pin is visible.

          CI running on this pull request is what checks the new images, which is why this is a pull request and not a push." \
            || gh pr edit "$branch" --body "Monthly mirror refresh (updated $(date -u +%Y-%m-%d))." 
